<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>PaperPal</title>
    <script>
      (function () {
        var parts = location.pathname.split("/").filter(Boolean);
        if (parts[parts.length - 1] === "index.html") parts.pop();
        var route = parts[parts.length - 1] || "";
        var known = ["bank", "practice", "papers"];
        if (known.indexOf(route) !== -1) {
          location.replace("/" + parts.slice(0, -1).concat(route + "/").join("/"));
        } else {
          location.replace("/" + (parts.length > 1 ? parts[0] + "/" : ""));
        }
      })();
    </script>
  </head>
  <body>
    <p><a href="./">Open PaperPal</a></p>
  </body>
</html>
